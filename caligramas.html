<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas de Desenho</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        /* Estilo aplicado quando a interface estiver desativada */
        body.interface-disabled .toolbar,
        body.interface-disabled canvas,
        body.interface-disabled h2 {
            opacity: 0.3;
            pointer-events: none;
            /* Impede qualquer clique ou interação */
            user-select: none;
        }

        .toolbar {
            display: flex;
            gap: 15px;
            align-items: center;
            background: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        canvas {
            background-color: #ffffff;
            border: 2px solid #333;
            border-radius: 4px;
            cursor: crosshair;
            touch-action: none;
            /* Previne scroll ao desenhar no celular */
            transition: opacity 0.3s ease;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        #btnDraw {
            background: #333;
            color: #fff;
        }

        #btnErase {
            background: #ddd;
            color: #333;
        }

        #btnSave {
            background: #4CAF50;
            color: #fff;
            font-size: 16px;
        }

        #btnSave:hover {
            background: #45a049;
        }

        .active-tool {
            box-shadow: 0 0 0 3px #2196F3;
        }

        #statusMessage {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body class="interface-disabled">

    <h2>Crie seu Desenho</h2>

    <div class="toolbar">
        <button id="btnDraw" class="active-tool">Lápis (Preto)</button>
        <button id="btnErase">Borracha</button>

        <label for="brushSize">Tamanho:</label>
        <input type="range" id="brushSize" min="1" max="50" value="5">

        <button id="btnSave">Salvar no Drive</button>
    </div>

    <canvas id="drawCanvas" width="800" height="600"></canvas>

    <div id="statusMessage">Pressione "I" no teclado para ativar a interface</div>

    <script>
        // COLOQUE A URL DO SEU GOOGLE APPS SCRIPT AQUI
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwLX8BehK4UtrriwMfk4nM82FbBirwv6z2zSVr1UBqiqTyiP_j-Pgs7viYSKlEmF1jg/exec';

        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const statusMsg = document.getElementById('statusMessage');

        let isUIActive = false; // Começa DESATIVADA
        let isDrawing = false;
        let mode = 'draw'; // 'draw' ou 'erase'
        let brushSize = 5;

        // Preenche o fundo com branco
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // --- ATIVAÇÃO/DESATIVAÇÃO VIA TECLA 'I' ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'i' || e.key === 'I') {
                isUIActive = !isUIActive;

                if (isUIActive) {
                    document.body.classList.remove('interface-disabled');
                    statusMsg.innerText = "Interface Ativa";
                    statusMsg.style.color = "green";
                    setTimeout(() => { if (statusMsg.innerText === "Interface Ativa") statusMsg.innerText = ""; }, 2000);
                } else {
                    document.body.classList.add('interface-disabled');
                    statusMsg.innerText = "Pressione \"I\" no teclado para ativar a interface";
                    statusMsg.style.color = "#333";
                }
            }
        });

        // Controles de UI
        const btnDraw = document.getElementById('btnDraw');
        const btnErase = document.getElementById('btnErase');
        const sliderSize = document.getElementById('brushSize');

        sliderSize.addEventListener('input', (e) => brushSize = e.target.value);

        btnDraw.addEventListener('click', () => {
            mode = 'draw';
            btnDraw.classList.add('active-tool');
            btnErase.classList.remove('active-tool');
        });

        btnErase.addEventListener('click', () => {
            mode = 'erase';
            btnErase.classList.add('active-tool');
            btnDraw.classList.remove('active-tool');
        });

        // Funções de Desenho
        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.clientX || (evt.touches && evt.touches[0].clientX);
            const clientY = evt.clientY || (evt.touches && evt.touches[0].clientY);
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        const startDrawing = (e) => {
            if (!isUIActive) return; // Trava o desenho se estiver desativado
            e.preventDefault();
            isDrawing = true;
            draw(e);
        };

        const stopDrawing = () => {
            isDrawing = false;
            ctx.beginPath();
        };

        const draw = (e) => {
            if (!isDrawing || !isUIActive) return;
            e.preventDefault();

            const pos = getMousePos(e);

            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.strokeStyle = mode === 'draw' ? '#000000' : '#ffffff';

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        };

        // Eventos de Mouse
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseout', stopDrawing);

        // Eventos de Touch
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
