<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interface de Desenho</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            /* O padding lateral de 15px garante a "borda" vazia ao redor do celular */
            padding: 15px 15px 30px 15px;
            overscroll-behavior-y: contain;
        }

        h2 {
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            /* Barra de ferramentas mais compacta */
            box-sizing: border-box;
        }

        /* O CONTAINER define o tamanho flexível e força o formato quadrado */
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            /* Trava no tamanho real para quem estiver no PC */
            aspect-ratio: 1 / 1;
            /* Força o formato perfeitamente quadrado! */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            /* Sombra elegante */
            border-radius: 4px;
        }

        /* O CANVAS apenas preenche 100% do quadrado que o container definiu */
        canvas {
            background-color: #ffffff;
            border: 2px solid #333;
            border-radius: 4px;
            cursor: none;
            /* Esconde cursor do mouse para o nosso preview */
            touch-action: none;
            display: block;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        #cursorPreview {
            position: fixed;
            border: 1px solid #000;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 20;
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.9), inset 0 0 2px rgba(255, 255, 255, 0.9);
        }

        #statusMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-weight: bold;
            font-size: 20px;
            text-align: center;
            display: none;
            z-index: 10;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            font-size: 14px;
        }

        #btnDraw {
            background: #333;
            color: #fff;
        }

        #btnErase {
            background: #ddd;
            color: #333;
        }

        #btnSave {
            background: #4CAF50;
            color: #fff;
            font-size: 16px;
            width: 100%;
            max-width: 150px;
        }

        #btnSave:hover {
            background: #45a049;
        }

        .active-tool {
            box-shadow: 0 0 0 3px #2196F3;
        }
    </style>
</head>

<body>

    <h2>Caligrama</h2>

    <div class="toolbar">
        <button id="btnDraw" class="active-tool">Lápis</button>
        <button id="btnErase">Borracha</button>

        <label for="brushSize" style="font-size:14px; font-weight:bold;">Tam:</label>
        <input type="range" id="brushSize" min="1" max="50" value="25" style="width: 80px;">

        <button id="btnSave">Enviar</button>
    </div>

    <!-- O Container Quadrado -->
    <div class="canvas-container">
        <!-- Resolução interna da imagem sempre será 800x800px para o Google Drive -->
        <canvas id="drawCanvas" width="800" height="800"></canvas>
        <div id="statusMessage"></div>
    </div>

    <div id="cursorPreview"></div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxDQgWsR62kCxY7gmI6dawdEKH3Kj9S9XB3VZxcRDfJhEgMk3e1jOr11DNHFJoEkzST/exec';

        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const statusMsg = document.getElementById('statusMessage');
        const cursorPreview = document.getElementById('cursorPreview');

        let isDrawing = false;
        let mode = 'draw';
        let brushSize = 25;

        // Pinta o fundo de branco inicialmente
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // --- CALCULA O TAMANHO VISUAL DO PINCEL NO CELULAR ---
        function updatePreviewSize() {
            const rect = canvas.getBoundingClientRect();
            // A proporção entre os 800px originais e o tamanho real na tela do celular
            const scaleX = rect.width / canvas.width;

            const visualSize = brushSize * scaleX;
            cursorPreview.style.width = visualSize + 'px';
            cursorPreview.style.height = visualSize + 'px';
        }

        updatePreviewSize();
        window.addEventListener('resize', updatePreviewSize);

        // Controles das ferramentas
        const btnDraw = document.getElementById('btnDraw');
        const btnErase = document.getElementById('btnErase');
        const sliderSize = document.getElementById('brushSize');

        sliderSize.addEventListener('input', (e) => {
            brushSize = e.target.value;
            updatePreviewSize();
        });

        btnDraw.addEventListener('click', () => {
            mode = 'draw';
            btnDraw.classList.add('active-tool');
            btnErase.classList.remove('active-tool');
        });

        btnErase.addEventListener('click', () => {
            mode = 'erase';
            btnErase.classList.add('active-tool');
            btnDraw.classList.remove('active-tool');
        });

        // Converte as coordenadas do toque/mouse para dentro da imagem de 800x800
        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.clientX || (evt.touches && evt.touches[0].clientX);
            const clientY = evt.clientY || (evt.touches && evt.touches[0].clientY);

            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY,
                screenX: clientX,
                screenY: clientY
            };
        }

        function updateCursorPreview(pos) {
            if (pos.screenX && pos.screenY) {
                cursorPreview.style.left = pos.screenX + 'px';
                cursorPreview.style.top = pos.screenY + 'px';
            }
        }

        const startDrawing = (e) => {
            e.preventDefault();
            isDrawing = true;
            const pos = getMousePos(e);
            updateCursorPreview(pos);

            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.strokeStyle = mode === 'draw' ? '#000000' : '#ffffff';
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        };

        const stopDrawing = () => {
            isDrawing = false;
            ctx.beginPath();
        };

        const draw = (e) => {
            e.preventDefault();
            const pos = getMousePos(e);
            updateCursorPreview(pos);

            if (!isDrawing) return;

            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.strokeStyle = mode === 'draw' ? '#000000' : '#ffffff';

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        };

        // Eventos
        canvas.addEventListener('mouseenter', () => cursorPreview.style.display = 'block');
        canvas.addEventListener('mouseleave', () => {
            cursorPreview.style.display = 'none';
            stopDrawing();
        });
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', (e) => {
            cursorPreview.style.display = 'block';
            startDrawing(e);
        }, { passive: false });
        canvas.addEventListener('touchend', () => {
            cursorPreview.style.display = 'none';
            stopDrawing();
        });
        canvas.addEventListener('touchmove', draw, { passive: false });

        // Enviar imagem para o Google Drive
        document.getElementById('btnSave').addEventListener('click', () => {
            const dataURL = canvas.toDataURL('image/png');
            const base64Data = dataURL.split(',')[1];
            const timestamp = new Date().getTime();

            // Limpa imediatamente a tela
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            cursorPreview.style.display = 'none';
            statusMsg.innerText = "Enviando...";
            statusMsg.style.color = "#333";
            statusMsg.style.display = "block";

            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    image: base64Data,
                    filename: 'desenho_' + timestamp + '.png'
                })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        statusMsg.innerText = "✓ Enviado!";
                        statusMsg.style.color = "green";
                    } else {
                        statusMsg.innerText = "Erro ao salvar.";
                        statusMsg.style.color = "red";
                    }
                    setTimeout(() => { statusMsg.style.display = "none"; }, 2500);
                })
                .catch(error => {
                    console.error("Erro:", error);
                    statusMsg.innerText = "Erro de conexão.";
                    statusMsg.style.color = "red";
                    setTimeout(() => { statusMsg.style.display = "none"; }, 2500);
                });
        });
    </script>
</body>

</html>
