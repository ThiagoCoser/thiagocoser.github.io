<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Visualize a obra em realidade aumentada — Beyond the Surface, FAMUN 2026">
  <title>AR Viewer | Beyond the Surface</title>
  <link rel="stylesheet" href="style.css">
  <!-- model-viewer for 3D rendering and AR -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
    model-viewer::part(default-progress-bar) {
      background: linear-gradient(135deg, #d4a853, #f0d090);
    }
    .ar-info-card {
      position: relative;
      z-index: 1;
      max-width: 600px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 20px 24px;
      backdrop-filter: blur(20px);
      margin-top: 20px;
    }
    .ar-info-card h3 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.1rem;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .ar-info-card p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .ar-info-card .tag {
      display: inline-block;
      padding: 3px 10px;
      font-size: 0.7rem;
      font-weight: 600;
      border-radius: 100px;
      background: rgba(212, 168, 83, 0.15);
      color: var(--accent-gold);
      border: 1px solid rgba(212, 168, 83, 0.25);
      margin-bottom: 8px;
    }
    .ar-btn-overlay {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      background: var(--gradient-gold);
      border: none;
      color: #0a0a12;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 8px 24px rgba(212, 168, 83, 0.3);
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Animated Background -->
  <div class="bg-animation">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="ar-container">
    <div class="ar-header">
      <h1 id="arTitle">Carregando...</h1>
      <p id="arArtist"></p>
    </div>

    <div class="ar-viewer-wrapper" id="viewerWrapper" style="position: relative;">
      <model-viewer
        id="modelViewer"
        src=""
        alt="Modelo 3D da obra"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        environment-image="neutral"
        exposure="1"
        style="width:100%; height:100%; background: #12121f;"
      >
        <button slot="ar-button" class="ar-btn-overlay">
          📸 Ativar Câmera AR
        </button>
      </model-viewer>
    </div>

    <div class="ar-info-card" id="arInfoCard" style="display:none;">
      <span class="tag" id="arTag"></span>
      <h3 id="arCardTitle"></h3>
      <p id="arCardDesc"></p>
    </div>

    <a class="ar-back" href="index.html" id="backBtn">
      ← Voltar à Galeria
    </a>
  </div>

  <script>
    const obras = {
      A: {
        title: 'Sphere Within Sphere',
        artist: 'Arnaldo Pomodoro',
        meta: 'Itália, 1996',
        model: 'Assets/A.glb',
        description: 'Uma esfera dourada dentro de outra esfera, símbolo da fragilidade da ordem mundial.'
      },
      B: {
        title: 'Non Violence',
        artist: 'Carl Fredrik Reuterswärd',
        meta: 'Luxemburgo (em nome da Suécia), 1988',
        model: 'Assets/B.glb',
        description: 'Um revólver com o cano amarrado em nó — símbolo universal do desarmamento.'
      },
      C: {
        title: 'Busto de Mahatma Gandhi',
        artist: 'Ram Sutar',
        meta: 'Índia, 2022',
        model: 'Assets/C.glb',
        description: 'Primeira escultura de Gandhi na sede da ONU, homenagem à resistência não violenta.'
      }
    };

    function init() {
      const params = new URLSearchParams(window.location.search);
      const obraId = params.get('obra');

      if (!obraId || !obras[obraId]) {
        document.getElementById('arTitle').textContent = 'Obra não encontrada';
        return;
      }

      const obra = obras[obraId];

      // Update page info
      document.title = `${obra.title} — AR | Beyond the Surface`;
      document.getElementById('arTitle').textContent = obra.title;
      document.getElementById('arArtist').textContent = `${obra.artist} — ${obra.meta}`;

      // Show info card
      const infoCard = document.getElementById('arInfoCard');
      infoCard.style.display = 'block';
      document.getElementById('arTag').textContent = `Obra ${obraId}`;
      document.getElementById('arCardTitle').textContent = obra.title;
      document.getElementById('arCardDesc').textContent = obra.description;

      // Set model source (GLB format)
      const viewer = document.getElementById('modelViewer');
      viewer.setAttribute('src', obra.model);
    }

    init();
  </script>
</body>
</html>
