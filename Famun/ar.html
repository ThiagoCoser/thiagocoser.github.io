<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realidade Aumentada | Beyond the Surface</title>
  
  <!-- A-Frame and MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #000;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
    }
    .header {
      background: rgba(22, 22, 40, 0.85);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid rgba(212, 168, 83, 0.4);
      color: #fff;
    }
    .header h1 {
      margin: 0;
      font-size: 1.2rem;
      color: #d4a853;
    }
    .header p {
      margin: 5px 0 0 0;
      font-size: 0.9rem;
      color: #ccc;
    }
    .back-btn {
      pointer-events: auto;
      display: inline-block;
      margin-bottom: 12px;
      color: #d4a853;
      text-decoration: none;
      font-weight: bold;
      background: rgba(22, 22, 40, 0.8);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(212, 168, 83, 0.4);
    }
    #scanning-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      padding: 20px 40px;
      border-radius: 30px;
      color: white;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
      font-weight: 500;
      transition: opacity 0.3s ease;
    }
    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  
  <div id="ui-overlay">
    <div>
      <a href="index.html" class="back-btn">← Voltar à Galeria</a>
      <div class="header">
        <h1 id="obra-title">Carregando AR...</h1>
        <p>Aponte a câmera para o QR Code físico.</p>
      </div>
    </div>
    <div id="scanning-overlay">Procurando QR Code...</div>
  </div>

  <!-- Cena do MindAR. Desligamos a UI padrão dele (uiScanning: no) para usar a nossa -->
  <a-scene mindar-image="imageTargetSrc: Assets/targets.mind; autoStart: true; uiScanning: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="modelA" src="Assets/A.glb"></a-asset-item>
      <a-asset-item id="modelB" src="Assets/B.glb"></a-asset-item>
      <a-asset-item id="modelC" src="Assets/C.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targetIndex 0: Obra A (qr_A.png) -->
    <!-- Rotação 90 0 0 normalmente faz o modelo ficar "em pé" em cima de um papel na mesa -->
    <a-entity mindar-image-target="targetIndex: 0" id="targetA">
      <a-gltf-model src="#modelA" position="0 0 0" scale="0.2 0.2 0.2" rotation="90 0 0"></a-gltf-model>
    </a-entity>

    <!-- targetIndex 1: Obra B (qr_B.png) -->
    <a-entity mindar-image-target="targetIndex: 1" id="targetB">
      <a-gltf-model src="#modelB" position="0 0 0" scale="0.2 0.2 0.2" rotation="90 0 0"></a-gltf-model>
    </a-entity>

    <!-- targetIndex 2: Obra C (qr_C.png) -->
    <a-entity mindar-image-target="targetIndex: 2" id="targetC">
      <a-gltf-model src="#modelC" position="0 0 0" scale="0.2 0.2 0.2" rotation="90 0 0"></a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    const obrasData = {
      A: { title: 'Sphere Within Sphere' },
      B: { title: 'Non Violence' },
      C: { title: 'Busto de Mahatma Gandhi' }
    };

    const params = new URLSearchParams(window.location.search);
    const obraId = params.get('obra');

    if (obraId && obrasData[obraId]) {
      document.getElementById('obra-title').textContent = obrasData[obraId].title;
    }

    // Lógica para esconder o aviso de "Procurando QR Code" quando a câmera achar
    const targetA = document.getElementById('targetA');
    const targetB = document.getElementById('targetB');
    const targetC = document.getElementById('targetC');
    const scanningOverlay = document.getElementById('scanning-overlay');

    function onTargetFound() {
      scanningOverlay.classList.add('hidden');
    }
    function onTargetLost() {
      scanningOverlay.classList.remove('hidden');
    }

    targetA.addEventListener('targetFound', onTargetFound);
    targetA.addEventListener('targetLost', onTargetLost);
    targetB.addEventListener('targetFound', onTargetFound);
    targetB.addEventListener('targetLost', onTargetLost);
    targetC.addEventListener('targetFound', onTargetFound);
    targetC.addEventListener('targetLost', onTargetLost);
  </script>
</body>
</html>
