<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explosão de Partículas | Festa Premium</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta name="description" content="Uma experiência interativa com explosão de partículas de festa de alta performance.">
</head>
<body>
    <div class="container">
        <h1 class="title">Prepare-se para o Show</h1>
        <p class="subtitle">Clique no botão abaixo para iniciar a celebração</p>
        
        <div class="counter-display">
            <span class="counter-label">CLIQUES:</span>
            <span id="clickCount" class="counter-number">0</span>
        </div>

        <div class="button-wrapper">
            <button id="partyButton" class="party-button">
                <span>SOLTAR FESTA!</span>
                <div class="button-glow"></div>
            </button>
        </div>
    </div>

    <canvas id="particleCanvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
